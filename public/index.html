<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель управления - Authentication System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .login-screen {
      padding: 40px;
      text-align: center;
    }

    .login-screen h1 {
      margin-bottom: 30px;
      color: #333;
    }

    .login-screen input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 2px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .login-screen input:focus {
      outline: none;
      border-color: #667eea;
    }

    .login-screen button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .login-screen button:hover {
      transform: translateY(-2px);
    }

    .admin-panel {
      display: none;
      padding: 20px;
    }

    .admin-panel.active {
      display: block;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid #eee;
    }

    .header h1 {
      color: #333;
    }

    .logout-btn {
      padding: 10px 20px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .logout-btn:hover {
      background: #ff5252;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #eee;
    }

    .tab {
      padding: 12px 20px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: #999;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }

    .tab.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
    }

    .form-group input {
      flex: 1;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 5px;
    }

    .form-group button {
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .form-group button:hover {
      background: #764ba2;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #f5f5f5;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid #ddd;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    tr:hover {
      background: #f9f9f9;
    }

    .action-btn {
      padding: 6px 12px;
      margin-right: 5px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
    }

    .ban-btn {
      background: #ff6b6b;
      color: white;
    }

    .unban-btn {
      background: #51cf66;
      color: white;
    }

    .delete-btn {
      background: #ffa500;
      color: white;
    }

    .status-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-active {
      background: #d3f9d8;
      color: #2f9e44;
    }

    .status-banned {
      background: #ffe3e3;
      color: #c92a2a;
    }

    .error {
      color: #c92a2a;
      padding: 12px;
      background: #ffe3e3;
      border-radius: 5px;
      margin-bottom: 15px;
    }

    .success {
      color: #2f9e44;
      padding: 12px;
      background: #d3f9d8;
      border-radius: 5px;
      margin-bottom: 15px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 10px;
      max-width: 400px;
      width: 100%;
    }

    .modal-content h2 {
      margin-bottom: 20px;
    }

    .modal-content input, .modal-content textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 2px solid #ddd;
      border-radius: 5px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-confirm {
      background: #667eea;
      color: white;
    }

    .btn-cancel {
      background: #ddd;
      color: #333;
    }

    .log-entry {
      padding: 12px;
      border-left: 4px solid #667eea;
      background: #f9f9f9;
      margin-bottom: 10px;
      border-radius: 3px;
    }

    .log-time {
      color: #999;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
      <h1>🔐 Панель управления</h1>
      <input type="password" id="adminPassword" placeholder="Введите пароль администратора" />
      <button onclick="loginAdmin()">Войти</button>
      <div id="loginError" class="error" style="display: none; margin-top: 15px;"></div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel">
      <div class="header">
        <h1>⚙️ Панель управления</h1>
        <button class="logout-btn" onclick="logout()">Выход</button>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('users')">Пользователи</button>
        <button class="tab" onclick="switchTab('logs')">Логи</button>
      </div>

      <!-- Users Tab -->
      <div id="users" class="tab-content active">
        <h2>Управление пользователями</h2>
        <div id="userMessage"></div>

        <div class="form-group">
          <input type="text" id="newUsername" placeholder="Имя пользователя" />
          <input type="password" id="newPassword" placeholder="Пароль" />
          <input type="email" id="newEmail" placeholder="Email (опционально)" />
          <button onclick="createUser()">Создать</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Имя</th>
              <th>Email</th>
              <th>HWID</th>
              <th>Статус</th>
              <th>Дата создания</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="usersList"></tbody>
        </table>
      </div>

      <!-- Logs Tab -->
      <div id="logs" class="tab-content">
        <h2>История действий</h2>
        <div id="logsList"></div>
      </div>
    </div>
  </div>

  <!-- Ban Modal -->
  <div class="modal" id="banModal">
    <div class="modal-content">
      <h2>Забанить пользователя</h2>
      <textarea id="banReason" placeholder="Причина бана (опционально)" rows="4"></textarea>
      <div class="modal-buttons">
        <button class="btn-confirm" onclick="confirmBan()">Забанить</button>
        <button class="btn-cancel" onclick="closeModal('banModal')">Отмена</button>
      </div>
    </div>
  </div>

  <script>
    let currentToken = null;
    let currentBanUserId = null;

    async function loginAdmin() {
      const password = document.getElementById('adminPassword').value;
      const errorDiv = document.getElementById('loginError');

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await response.json();

        if (!response.ok) {
          errorDiv.textContent = 'Неверный пароль';
          errorDiv.style.display = 'block';
          return;
        }

        currentToken = data.token;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminPanel').classList.add('active');
        loadUsers();
        loadLogs();
      } catch (err) {
        errorDiv.textContent = 'Ошибка подключения';
        errorDiv.style.display = 'block';
      }
    }

    async function loadUsers() {
      try {
        const response = await fetch('/api/admin/users', {
          headers: { 'Authorization': `Bearer ${currentToken}` }
        });

        const users = await response.json();
        const tbody = document.getElementById('usersList');
        tbody.innerHTML = '';

        users.forEach(user => {
          const row = document.createElement('tr');
          const status = user.banned ? 'Забанен' : 'Активен';
          const statusClass = user.banned ? 'status-banned' : 'status-active';
          const hwidDisplay = user.hwid ? user.hwid.substring(0, 12) + '...' : 'Нет';

          row.innerHTML = `
            <td>${user.id}</td>
            <td>${user.username}</td>
            <td>${user.email || '-'}</td>
            <td title="${user.hwid || 'Нет'}">${hwidDisplay}</td>
            <td><span class="status-badge ${statusClass}">${status}</span></td>
            <td>${new Date(user.created_at).toLocaleDateString('ru-RU')}</td>
            <td>
              ${!user.banned ? `<button class="action-btn ban-btn" onclick="openBanModal(${user.id})">Забанить</button>` : `<button class="action-btn unban-btn" onclick="unbanUser(${user.id})">Разбанить</button>`}
              ${user.hwid ? `<button class="action-btn ban-btn" onclick="banHWID('${user.hwid}', '${user.username}')">Бан HWID</button>` : ''}
              ${user.hwid ? `<button class="action-btn" style="background: #9c27b0; color: white;" onclick="resetHWID(${user.id}, '${user.username}')">Сбросить HWID</button>` : ''}
              <button class="action-btn delete-btn" onclick="deleteUser(${user.id})">Удалить</button>
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        console.error('Error loading users:', err);
      }
    }

    async function createUser() {
      const username = document.getElementById('newUsername').value;
      const password = document.getElementById('newPassword').value;
      const email = document.getElementById('newEmail').value;
      const messageDiv = document.getElementById('userMessage');

      if (!username || !password) {
        messageDiv.innerHTML = '<div class="error">Заполните имя и пароль</div>';
        return;
      }

      try {
        const response = await fetch('/api/admin/users', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentToken}`
          },
          body: JSON.stringify({ username, password, email })
        });

        if (!response.ok) {
          const err = await response.json();
          messageDiv.innerHTML = `<div class="error">Ошибка: ${err.error}</div>`;
          return;
        }

        messageDiv.innerHTML = '<div class="success">Пользователь создан!</div>';
        document.getElementById('newUsername').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('newEmail').value = '';
        loadUsers();
      } catch (err) {
        messageDiv.innerHTML = `<div class="error">Ошибка подключения</div>`;
      }
    }

    function openBanModal(userId) {
      currentBanUserId = userId;
      document.getElementById('banModal').classList.add('active');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    async function confirmBan() {
      const reason = document.getElementById('banReason').value;

      try {
        const response = await fetch(`/api/admin/users/${currentBanUserId}/ban`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentToken}`
          },
          body: JSON.stringify({ reason })
        });

        if (response.ok) {
          closeModal('banModal');
          document.getElementById('banReason').value = '';
          loadUsers();
          loadLogs();
        }
      } catch (err) {
        console.error('Error banning user:', err);
      }
    }

    async function unbanUser(userId) {
      try {
        const response = await fetch(`/api/admin/users/${userId}/unban`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${currentToken}` }
        });

        if (response.ok) {
          loadUsers();
          loadLogs();
        }
      } catch (err) {
        console.error('Error unbanning user:', err);
      }
    }

    async function deleteUser(userId) {
      if (!confirm('Вы уверены?')) return;

      try {
        const response = await fetch(`/api/admin/users/${userId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${currentToken}` }
        });

        if (response.ok) {
          loadUsers();
          loadLogs();
        }
      } catch (err) {
        console.error('Error deleting user:', err);
      }
    }

    async function banHWID(hwid, username) {
      const reason = prompt(`Причина бана HWID ${hwid.substring(0, 12)}...\nаккаунта ${username}:`);
      if (reason === null) return;

      try {
        const response = await fetch(`/api/admin/hwid/${encodeURIComponent(hwid)}/ban`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentToken}`
          },
          body: JSON.stringify({ reason })
        });

        if (response.ok) {
          alert('HWID забанен!');
          loadUsers();
          loadLogs();
        }
      } catch (err) {
        console.error('Error banning HWID:', err);
      }
    }

    async function resetHWID(userId, username) {
      if (!confirm(`Сбросить HWID для ${username}?\nЭто позволит использовать аккаунт на другом компьютере.`)) return;

      try {
        const response = await fetch(`/api/admin/users/${userId}/reset-hwid`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentToken}`
          }
        });

        if (response.ok) {
          alert('HWID сброшен!');
          loadUsers();
          loadLogs();
        }
      } catch (err) {
        console.error('Error resetting HWID:', err);
      }
    }

    async function loadLogs() {
      try {
        const response = await fetch('/api/admin/logs', {
          headers: { 'Authorization': `Bearer ${currentToken}` }
        });

        const logs = await response.json();
        const logsDiv = document.getElementById('logsList');
        logsDiv.innerHTML = '';

        logs.forEach(log => {
          const logEl = document.createElement('div');
          logEl.className = 'log-entry';
          logEl.innerHTML = `
            <strong>${log.action}</strong><br>
            <span class="log-time">${new Date(log.created_at).toLocaleString('ru-RU')}</span>
          `;
          logsDiv.appendChild(logEl);
        });
      } catch (err) {
        console.error('Error loading logs:', err);
      }
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));

      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');

      if (tabName === 'logs') loadLogs();
      if (tabName === 'users') loadUsers();
    }

    function logout() {
      currentToken = null;
      document.getElementById('adminPanel').classList.remove('active');
      document.getElementById('loginScreen').style.display = 'block';
      document.getElementById('adminPassword').value = '';
    }
  </script>
</body>
</html>
